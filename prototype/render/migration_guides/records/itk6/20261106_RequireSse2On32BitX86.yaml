title: 32-bit x86 requires SSE2 floating-point math
summary: |
  A 32-bit x86 build or client without SSE2 math now stops at an `#error` in
  `itkConfigure.h`.
categories: [CompilerEnvironment]
environment: [cxx, cmake]
impact: medium
pr: 7125
actions:
  - Build through ITK's CMake targets or `UseITK.cmake`, which add the flags.
  - Otherwise add `-msse2 -mfpmath=sse` (GCC, Clang) or `/arch:SSE2` (MSVC).
examples:
  - language: text
    note: The error a client sees without the flags.
    after: |
      itkConfigure.h: error: "ITK requires SSE2 floating-point math on 32-bit x86:
      use -msse2 -mfpmath=sse (GCC, Clang) or /arch:SSE2 (MSVC)"
